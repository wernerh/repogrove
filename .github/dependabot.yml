version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "tech-debt"
    groups:
      # react and react-dom are peer-linked (react-dom@X requires react@^X) and must be
      # bumped together — see TECH-DEBT.md 2026-09-28: #11 bumped react-dom alone and
      # broke `npm ci` on main for every PR until issue #26 was fixed.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # typescript-eslint (bundled transitively via eslint-config-next) doesn't support
      # TypeScript 7.x yet — see typescript-eslint/typescript-eslint#10940. PR #28 bumped
      # to 7.0.2 anyway (dependabot proposed it, then the owner merged it directly outside
      # the factory's CI-gated flow) and broke `npm run lint` on main — see TECH-DEBT.md
      # 2026-09-28. Reverted; ignoring major bumps here until that upstream gap closes so
      # dependabot doesn't keep re-proposing the same breaking change.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "tech-debt"
