name: Factory guardrails (PR)

on:
  pull_request:

jobs:
  check:
    name: scripts/factory/check.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/factory/check.py
