name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Factory guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/factory/check.py

  app:
    name: Lint, test, build (Next.js app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check app exists
        id: app
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        if: steps.app.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint --if-present
      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build --if-present
      - name: No app yet
        if: steps.app.outputs.exists == 'false'
        run: echo "No package.json yet (pre-Phase-1) — nothing to lint/test/build."

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "No lockfile yet — nothing to audit."
          fi
