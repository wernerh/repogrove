name: Design screenshots & accessibility

# Design lane's Playwright + axe-core harness (docs/adr/ADR-007-design-screenshot-a11y-harness.md,
# tests/design/screenshots.spec.ts), run on GitHub-hosted runners so it can actually
# fetch the self-hosted Google Fonts `next build` now needs (ADR-006) — the sandbox
# this factory runs in cannot reach fonts.googleapis.com, so this workflow is the only
# place the harness runs against the real, correctly-fonted production build.
#
# Deliberately NOT a required/blocking check (see ADR-007's addendum): it reports —
# screenshots + an axe-core WCAG 2.1 A/AA scan as a downloadable artifact — rather than
# gating other lanes' merges. A red run here is real signal for the design lane to
# triage next run, not a merge blocker for whoever's PR triggered it.
on:
  pull_request:
    paths:
      - "src/**"
      - "content/**"
      - "docs/design/**"
      - "playwright.config.ts"
      - "tests/design/**"
      - "scripts/design/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/design-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "docs/design/**"
      - "playwright.config.ts"
      - "tests/design/**"
      - "scripts/design/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/design-screenshots.yml"
  workflow_dispatch:

# Least-privilege (OWASP A05, same reasoning as ci.yml): this workflow only checks out
# the repo, builds it, and uploads its own run artifacts (artifact upload uses the
# runner's internal token, not GITHUB_TOKEN, so it needs no extra scope here) — no repo
# writes, no PR/issue comments. The one exception is the `commit-screenshots` job below,
# which overrides this default with its own job-level `contents: write` (RG-6, ADR-007
# addenda 2-3); every other job stays `contents: read`.
permissions:
  contents: read

jobs:
  screenshots:
    name: Playwright screenshots + axe-core (report only, does not gate merges)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check app exists
        id: app
        run: |
          if [ -f package.json ] && [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      # Not the sandbox's pre-installed Chromium (playwright.config.ts's
      # executablePath fallback only applies when that path exists) — a
      # GitHub-hosted runner needs Playwright's own managed browser, matching the
      # exact-pinned @playwright/test version (ADR-007).
      - name: Install Playwright's Chromium
        if: steps.app.outputs.exists == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build (static export)
        if: steps.app.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Screenshots + axe-core scan
        if: steps.app.outputs.exists == 'true'
        run: npm run design:screenshots

      # always(): still upload whatever screenshots were captured even if an axe-core
      # assertion failed partway through the suite — a red run is exactly when the
      # design lane most wants to see the images, not just the pass/fail summary.
      - name: Upload screenshots
        if: steps.app.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: design-screenshots
          path: docs/design/screenshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: No app yet
        if: steps.app.outputs.exists == 'false'
        run: echo "No package.json yet (pre-Phase-1) — nothing to screenshot."

  commit-screenshots:
    name: Commit real screenshots to main (push only)
    needs: screenshots
    if: |
      always() && github.event_name == 'push' && needs.screenshots.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download screenshots artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: design-screenshots
          path: docs/design/screenshots

      - name: Commit screenshot updates, if any
        if: steps.download.outcome == 'success'
        run: |
          set -eu
          git add docs/design/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git config user.name "repogrove-factory[bot]"
          git config user.email "repogrove-factory@users.noreply.github.com"
          git commit -m "design: refresh committed screenshots [skip ci]" -m "Mechanical commit of the screenshots job's own Playwright output (docs/design/screenshots/) for this push to main — a deterministic rendering of pixels already reviewed via the PR that changed the page, not a new editorial decision. See docs/adr/ADR-007-design-screenshot-a11y-harness.md addendum 2/3 (RG-6)."
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3) — rebasing onto the latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push committed screenshots after 3 attempts."
          exit 1

      - name: No screenshots artifact to commit
        if: steps.download.outcome != 'success'
        run: echo "No design-screenshots artifact this run (app didn't exist yet, or the screenshots job produced none) — nothing to commit."