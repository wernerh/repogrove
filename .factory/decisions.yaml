- id: RG-2
  lane: dev
  question: >
    Which hosting target should RepoGrove use? (1) Cloudflare Pages — matches your
    original spec preference; (2) Vercel — first-party Next.js hosting, simplest DX;
    (3) an existing cloud account of yours, if you have one. Deploy jobs stay disabled
    until this is answered.
  options: ["Cloudflare Pages", "Vercel", "Owner's existing account"]
  recommended_default: "Cloudflare Pages"
  reversibility: expensive
  asked_at: "2026-09-27T00:00:00Z"
  email_thread_id: "1a0e3c35fae4b534"
  default_due_at: null
  status: ANSWERED
  answer: >
    "can we host as a static app on azure storage" — owner's existing cloud account
    (Azure), Storage static-website hosting. Recorded 2026-09-27 dev run. Caveat noted
    in ADR-002: Azure Storage static-website hosting serves static files only (no SSR,
    no API routes) — distinct from Azure Static Web Apps, which adds a Functions
    backend. Next.js static export (`output: "export"`) is compatible with this for
    Phase 1 (no API surface yet); Phase 3's search/newsletter-signup API will need
    either a client-side-only design or Azure Static Web Apps/Functions — flagged as a
    Phase 3 consideration, not a blocker now. Deploy jobs stay stubbed/disabled per
    CLAUDE.md rule 6 (creating cloud resources is a human gate) regardless of this
    answer — the owner still needs to provision the Azure Storage account itself.
  answered_at: "2026-09-27T17:24:28Z"

